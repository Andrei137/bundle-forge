spring:
  application:
    name: bundle-forge
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

file:
  upload-dir: uploads

security:
  jwt:
    secret-key: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdGVzdGluZy1wdXJwb3Nlcy1vbmx5LXBsZWFzZS1jaGFuZ2U=}
    # Lifetime of a normal session JWT (no "Keep me signed in"). Default 8h.
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    # Lifetime when the user opts into "Keep me signed in". Default 30d.
    long-expiration-ms: ${JWT_LONG_EXPIRATION_MS:2592000000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
