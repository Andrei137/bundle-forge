# Spring Boot backend Fly app. Public HTTPS; talks to MySQL/Redis over the
# private 6PN network. Secrets (DB_PASS, JWT_SECRET, REDIS_PASSWORD, STRIPE_*)
# are set via `fly secrets`, not committed here.
app = 'bundle-forge-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  SPRING_PROFILES_ACTIVE = 'dev'
  DB_HOST = 'bundle-forge-mysql.internal'
  DB_PORT = '3306'
  DB_NAME = 'bundle-forge'
  DB_USER = 'bundle-forge'
  REDIS_HOST = 'bundle-forge-redis.internal'
  REDIS_PORT = '6379'
  APP_CORS_ALLOWED_ORIGINS = 'https://bundle-forge-web.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  # No actuator/root endpoint, so check the port is accepting connections.
  [[http_service.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'

[mounts]
  source = 'uploads'
  destination = '/app/uploads'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
