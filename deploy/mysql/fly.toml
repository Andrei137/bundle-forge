# Standalone MySQL 8.4 as its own Fly app (private network only).
# Reached by the backend at bundle-forge-mysql.internal:3306.
app = 'bundle-forge-mysql'
primary_region = 'fra'

[build]
  image = 'mysql:8.4'

# Container args (override the mysql image CMD). For 8.4 enable the native
# password plugin. datadir MUST be an empty subdirectory of the mounted volume
# (the mount root contains lost+found, which blocks MySQL initialization).
[processes]
  app = "--datadir /data/mysql --mysql-native-password=ON"

[mounts]
  source = 'mysqldata'
  destination = '/data'

# Not-so-secret bootstrap env. Passwords are set via `fly secrets`.
[env]
  MYSQL_DATABASE = 'bundle-forge'
  MYSQL_USER = 'bundle-forge'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
